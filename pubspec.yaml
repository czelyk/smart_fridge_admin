name: smart_fridge_admin
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.2.0 # Uyumlu sürüm
  firebase_auth: ^5.1.3 # Yeni eklendi
  cloud_firestore: ^5.1.0 # Uyumlu sürüm
  cloud_functions: ^5.0.3 # Uyumlu sürüm
  fl_chart: ^0.66.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  google_fonts: ^6.3.0
  faker: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#001F1F"
  adaptive_icon_foreground: "assets/images/logo.png"
